server:
  port: 8888

spring:
  application:
    name: battle-coach
  config:
    # 로컬 비밀값(gitignore 대상). 없으면 환경변수만 사용한다.
    import: optional:classpath:application-local.yml
  datasource:
    url: jdbc:mysql://localhost:3308/battle_coach?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  web:
    resources:
      # 정적 파일 주소에 내용 해시를 붙인다(/css/app-<해시>.css). 파일이 바뀌면 주소가 바뀌어 브라우저 캐시가 옛 파일을 쓰지 않는다.
      # Thymeleaf 의 @{/css/app.css} 링크는 자동으로 해시 주소로 바뀐다.
      chain:
        strategy:
          content:
            enabled: true
            paths: /**
      cache:
        cachecontrol:
          max-age: 365d
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul

nexon:
  api:
    base-url: https://open.api.nexon.com
    api-key: ${NEXON_API_KEY}
    permits-per-second: 5      # 개발 단계 키 한도
    max-attempts: 3            # 429, 5xx 재시도 포함 총 시도 횟수
    initial-backoff: 500ms

cache:
  ocid-ttl: 1d
  replay-list-ttl: 10m
  job-statistics-ttl: 10m

# 랭커 수집 관리 API(/api/admin/rankers). 인증이 없으므로 로컬에서만 켠다(application-local.yml).
collector:
  enabled: false
