<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('비교할 기록 선택')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main class="container">
    <p class="breadcrumb">
        <a th:href="@{/replays/{id}(id=${base.replayId()})}"
           th:text="|${base.characterName()} ${#temporals.format(base.registerDate(), 'yyyy-MM-dd')} 기록으로 돌아가기|">돌아가기</a>
    </p>
    <p class="eyebrow">Select Reference</p>
    <h1>비교할 기준 기록 선택</h1>
    <p class="muted">
        <span class="role">내 기록</span>
        <span th:text="|${base.characterName()} (${base.characterClass()} Lv.${base.characterLevel()}) · ${#temporals.format(base.registerDate(), 'yyyy-MM-dd')}|"></span>
    </p>

    <form class="search-inline compare-search" th:action="@{/compare/select}" method="get">
        <input type="hidden" name="base" th:value="${base.replayId()}">
        <input type="text" name="name" placeholder="기준 캐릭터명" maxlength="12" required th:value="${targetName}">
        <button type="submit">기록 찾기</button>
    </form>

    <p class="muted small">같은 직업(<span th:text="${base.characterClass()}">칼리</span>)의 기록끼리만 비교할 수 있습니다.</p>

    <h2 class="finding-group" th:text="|${targetName}의 기록|">기록</h2>
    <p th:if="${notice}" class="empty negative" th:text="${notice}">직업이 다릅니다.</p>
    <p th:if="${notice == null and #lists.isEmpty(candidates)}" class="empty">비교할 수 있는 기록이 없습니다. 연무장 기록을 등록하지 않은 캐릭터일 수 있습니다.</p>
    <table th:unless="${#lists.isEmpty(candidates)}" class="table">
        <thead>
        <tr>
            <th>기간</th>
            <th>등록일</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${candidates}">
            <td th:text="${item.periodNo()} + '기'">1기</td>
            <td th:text="${#temporals.format(item.registerDate(), 'yyyy-MM-dd')}">2026-08-06</td>
            <td class="right">
                <a th:href="@{/compare(base=${base.replayId()}, target=${item.replayId()})}">이 기록을 기준으로 비교</a>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
