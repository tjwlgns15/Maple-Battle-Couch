<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('오류')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main class="container">
    <h1 th:text="${status} ?: '오류'">400</h1>

    <p><a th:href="@{/}">처음으로</a></p>
</main>
</body>
</html>
